<script>

const D=JSON.parse(document.getElementById('dashboard-data').textContent),ORDER=['overview','cleverence','pozyx'];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const streamScore=k=>D[k].reduce((s,m)=>s+m.progress*m.weight/100,0);
const totalScore=()=>((streamScore('cleverence')+streamScore('pozyx'))/2);
const phaseClass=(v,i)=>v>=99.999?'done':i>=3?'later':i===2?'next':v>0?'in-progress':'risk';
const phaseState=(v,i)=>v>=99.999?'Complete':i>=2?'Planned':v>0?'In progress':'Closure unverified';
function bar(v){return '<div class="track" role="progressbar" aria-label="Project scope progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v+'"><i style="width:'+v+'%"></i></div>';}
function scoreButton(v,key,month,extra=''){return '<button class="score-btn" data-score="'+key+'" data-month="'+month+'" aria-label="'+e(extra||'View '+key+' progress calculation')+'">'+pc(v)+'</button>';}
function title(name,eyebrow){return '<header class="title"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+name+'</h1></div><div class="title-meta"><b>POC WISE · KUANTAN</b><br>Status updated '+e(D.assessment.cutoffShort)+'<br><button data-method="1">Assessment method ⓘ</button></div></header>';}
function legend(){return '<div class="legend" aria-label="Timeline status legend"><span><i></i>Complete</span><span><i class="progress-dot"></i>In progress</span><span><i class="plan-dot"></i>Planned</span><span><i class="later-dot"></i>Upcoming</span></div>';}
function caption(num){return '<footer class="page-note"><span><button data-method="1">Progress calculation</button></span><span class="page-number">'+num+' / 03</span></footer>';}
function progress(v,key,i,label){return '<div class="scope-progress"><div class="progress-line"><span>'+label+'</span>'+scoreButton(v,key,i)+'</div>'+bar(v)+'</div>';}
function detailMonth(m,i,key){const v=m.progress;return '<article class="month '+phaseClass(v,i)+(i===1?' current':'')+'"><span class="node" aria-hidden="true"></span><div class="month-date">'+e(D.months[i])+'</div><div class="card"><div class="card-title"><div class="state-label">'+phaseState(v,i)+'</div><h3>'+e(m.phase)+'</h3></div>'+progress(v,key,i,'Scope progress')+'<section class="field"><h4>Scope</h4><ul>'+m.scope.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul></section><section class="field highlights"><h4>Highlights</h4><p>'+e(m.highlights)+'</p></section><section class="field support"><h4>Management support</h4><p>'+e(m.support)+'</p></section></div></article>';}
function metric(label,value,desc){return '<div class="metric"><div class="metric-label">'+label+'</div><strong>'+value+'</strong><div class="metric-desc">'+desc+'</div></div>';}
function detail(key){const isC=key==='cleverence',name=isC?'Cleverence':'Pozyx',pct=streamScore(key);const met=isC?metric('Project Progress',pc(pct),'Sep–Jan · four-month POC')+metric('Sep records / completed','51 / 48','21–30 Sep · partial month')+metric('Oct records / completed','59 / 51*','1–18 Oct · partial month')+metric('SAP quantity agreement','32 / 45','71.1% · 13 differences'):metric('Project Progress',pc(pct),'Sep–Jan · four-month POC')+metric('Indoor trial devices','6 / 10 / 4','Anchors / UWB / BLE tested')+metric('W4 checks passed','50 / 130','38.5% · not uptime')+metric('Gateway recovery','Completed','24–25 Oct · site visit');return '<section class="page '+(isC?'':'violet')+'" data-view="'+key+'" '+(active===key?'':'hidden')+' aria-label="'+name+' dashboard">'+title(name,isC?'WISE · INVENTORY AUTOMATION':'WISE · ASSET TRACKING')+'<div class="metrics">'+met+'</div><div class="timeline-head"><h2>Project Timeline</h2>'+legend()+'</div><div class="timeline">'+D[key].map((m,i)=>detailMonth(m,i,key)).join('')+'</div>'+caption(isC?'02':'03')+'</section>';}
function overviewMonth(m,i){const v=(D.cleverence[i].progress+D.pozyx[i].progress)/2;return '<article class="month '+phaseClass(v,i)+(i===1?' current':'')+'"><span class="node" aria-hidden="true"></span><div class="month-date">'+e(D.months[i])+'</div><div class="card"><div class="card-title"><h3>'+e(m.phase)+'</h3></div>'+progress(v,'overview',i,'Combined scope')+'<section class="field"><h4>Joint scope</h4><p>'+e(m.scope)+'</p></section><section class="field highlights"><h4>Highlights</h4><p>'+e(m.highlights)+'</p></section><section class="field support"><h4>Management support</h4><p>'+e(m.support)+'</p></section></div></article>';}
function overview(){

function fit(){const s=document.getElementById('stage');document.documentElement.style.setProperty('--scale',Math.min(s.clientWidth/1600,s.clientHeight/936));}
function navigate(key){active=ORDER.includes(key)?key:'overview';document.querySelectorAll('[data-view]').forEach(p=>p.hidden=p.dataset.view!==active);document.title=(active==='overview'?'Project overview':active==='cleverence'?'Cleverence':'Pozyx')+' · POC WISE';try{if(location.hash!=='#'+active)history.replaceState(null,'','#'+active);}catch{}document.getElementById('live').textContent='Page '+(ORDER.indexOf(active)+1)+' of 3: '+active;}

function methodHtml(){
 return '<p class="calc-sub">Weighted delivery assessment as of '+e(D.assessment.cutoff)+', measured against the four-month POC spanning September 2026–January 2027.</p>'+
 '<div class="method-grid"><section class="method-card"><h3>Scope weighting across calendar months</h3><p>A four-month POC spans five calendar-month labels. The original five scope milestones retain 20% weight each, independent of elapsed days. Cleverence and Pozyx each contribute 50% of project delivery. Final evaluation is in January.</p></section>'+
 '<section class="method-card"><h3>October: project-owner assessment</h3><p>The 28 Oct update sets Cleverence to 80% and Pozyx to 90%. October combined progress is (80% + 90%) ÷ 2 = 85%. Other months retain their existing report / field-based assessments.</p></section></div>'+
 '<table class="method-table"><thead><tr><th>Timeline month</th><th>Cleverence</th><th>Pozyx</th><th>Combined</th></tr></thead><tbody>'+D.months.map((m,i)=>'<tr><td>'+m+'</td><td>'+pc(D.cleverence[i].progress)+'</td><td>'+pc(D.pozyx[i].progress)+'</td><td>'+pc((D.cleverence[i].progress+D.pozyx[i].progress)/2)+'</td></tr>').join('')+
 '<tr><td><b>Full project scope</b></td><td><b>'+pc(streamScore('cleverence'))+'</b></td><td><b>'+pc(streamScore('pozyx'))+'</b></td><td><b>'+pc(totalScore())+'</b></td></tr></tbody></table>'+
 '<p class="method-detail"><b>Calculation:</b> Cleverence = ('+D.cleverence.map(m=>f(m.progress)).join(' + ')+') ÷ '+D.timelineMonthCount+' = '+pc(streamScore('cleverence'))+'. Pozyx = ('+D.pozyx.map(m=>f(m.progress)).join(' + ')+') ÷ '+D.timelineMonthCount+' = '+pc(streamScore('pozyx'))+'. Overall = ('+pc(streamScore('cleverence'))+' + '+pc(streamScore('pozyx'))+') ÷ 2 = '+pc(totalScore())+'.</p>'+
 '<p class="method-detail"><b>Latest status:</b> Cleverence stocktaking is complete; its report and root causes of any variances are pending. Pozyx has one remaining action: update e-mail alerts from Teams to other e-mail recipients. The 80% / 90% figures are the project owner’s monthly assessments. They do not assign passing results to individual tests that were not supplied.</p>'+
 '<p class="method-detail"><b>Separate historical measures:</b> 99 / 110 completed document records are report snapshots; W3 is provisional. 32 / 45 is SAP system agreement on 19 Oct, not physical inventory accuracy. 50 / 130 Pozyx checks is the W4 pass count before recovery, not current uptime.</p>'+
 '<div class="calc-selects"><button id="inspect-c" type="button">Inspect Cleverence basis</button><button id="inspect-p" type="button">Inspect Pozyx basis</button></div>';
}

function evidenceHtml(){

 const intro='<p class="calc-sub">'+name+' · '+e(D.months[calcMonth])+' · Monthly scope progress and its source.</p>'+selects;
 if(m.scoreType==='owner-reported'){
  return intro+'<div class="calc-scoreline"><span>Project-owner monthly assessment · 28 Oct 2026</span><b>'+pc(m.progress)+'</b></div><p class="calc-sub">'+e(m.basis)+'</p><div class="checkpoints">'+m.statusUpdates.map(u=>'<article class="checkpoint owner-checkpoint '+(u.state==='Complete'?'done':'partial')+'"><div><h3>'+e(u.name)+'</h3><p><b>'+e(u.source)+':</b> '+e(u.note)+'</p></div><div class="credit">'+e(u.state)+'</div></article>').join('')+'</div>';
 }
 return intro+'<div class="calc-scoreline"><span>'+fc(m.earned)+' earned / 6 equal checkpoint credits</span><b>'+pc(m.progress)+'</b></div><div class="checkpoints">'+m.checkpoints.map(g=>'<article class="checkpoint '+(g.credit>=1?'done':g.credit>0?'partial':'')+'"><div><h3>'+e(g.name)+'</h3><p><b>'+e(g.source)+':</b> '+e(g.note)+'</p></div><div class="credit">'+f(g.verified)+' / '+f(g.required)+'<small>'+fc(g.credit)+' credit</small></div></article>').join('')+'</div>';
}
const dialog=document.getElementById('calculation');
function showMethod(){document.getElementById('calculation-title').textContent='Assessment method & combined progress';document.getElementById('calculation-body').innerHTML=methodHtml();if(!dialog.open)dialog.showModal();}
function showEvidence(key,month){calcKey=key;calcMonth=Math.max(0,month);document.getElementById('calculation-title').textContent='Progress calculation & evidence';document.getElementById('calculation-body').innerHTML=evidenceHtml();if(!dialog.open)dialog.showModal();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,3000);}
function download(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#calculation').removeAttribute('open');clone.querySelector('#toast').hidden=true;const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='POC_WISE_Dashboard.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('HTML snapshot downloaded.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.method)showMethod();if(b.dataset.score){const k=b.dataset.score,i=Number(b.dataset.month);if(k==='method'||k==='overview'||i<0)showMethod();else showEvidence(k,i);}if(b.id==='inspect-c')showEvidence('cleverence',0);if(b.id==='inspect-p')showEvidence('pozyx',0);});
document.addEventListener('change',ev=>{if(ev.target.id==='evidence-stream')showEvidence(ev.target.value,calcMonth);if(ev.target.id==='evidence-month')showEvidence(calcKey,Number(ev.target.value));});
document.getElementById('previous').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));document.getElementById('close-calculation').addEventListener('click',()=>dialog.close());document.getElementById('download-html').addEventListener('click',download);window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));document.addEventListener('keydown',ev=>{if(dialog.open||ev.altKey||ev.ctrlKey||ev.metaKey)return;if(ev.key==='ArrowRight'){ev.preventDefault();move(1);}if(ev.key==='ArrowLeft'){ev.preventDefault();move(-1);}if(ev.key.toLowerCase()==='i')showMethod();if(ev.key.toLowerCase()==='d')download();});
document.getElementById('deck').innerHTML=overview()+detail('cleverence')+detail('pozyx');navigate(active);fit();
})();
</script></body></html>
